services:
  devwolf-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devwolf-portfolio
    restart: always
    environment:
      - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.http.routers.devwolf-web.rule=Host(`devwolf.${DOMAIN_NAME}`)
      - traefik.http.routers.devwolf-web.tls=true
      - traefik.http.routers.devwolf-web.entrypoints=web,websecure
      - traefik.http.routers.devwolf-web.tls.certresolver=mytlschallenge
      - traefik.http.services.devwolf-web.loadbalancer.server.port=3000
      - traefik.http.middlewares.devwolf-web-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.devwolf-web-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.devwolf-web-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.devwolf-web-headers.headers.contentTypeNosniff=true
      - traefik.http.http.middlewares.devwolf-web-compress.compress=true
      - traefik.http.routers.devwolf-web.middlewares=devwolf-web-headers@docker,devwolf-web-compress@docker
    networks:
      - n8n_evoapi

networks:
  n8n_evoapi:
    external: true